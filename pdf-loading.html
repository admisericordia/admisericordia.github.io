<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preparando planilla - PDF</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; background: #eef3f8; color: #263238; font-family: Arial, sans-serif; }
    .panel { width: min(520px, 100%); padding: 38px 34px 32px; border: 1px solid #d6e0e8; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(36, 67, 92, .14); text-align: center; }
    .marca { width: 58px; height: 58px; margin: 0 auto 20px; border-radius: 16px; display: grid; place-items: center; background: #1565c0; color: #fff; font-size: 28px; box-shadow: 0 8px 18px rgba(21, 101, 192, .25); }
    .spinner { width: 46px; height: 46px; margin: 0 auto 22px; border: 4px solid #dce7f2; border-top-color: #1565c0; border-right-color: #43a047; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; color: #123b63; font-size: 1.35rem; }
    .hoja { margin: 0 auto 18px; color: #607d8b; font-size: .92rem; overflow-wrap: anywhere; }
    .mensaje { margin: 0; color: #546e7a; font-size: .96rem; line-height: 1.5; }
    .parametros { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
    .parametro { padding: 7px 11px; border: 1px solid #d7e3ed; border-radius: 8px; background: #f5f9fc; color: #315d7e; font-size: .78rem; font-weight: 700; }
    .barra { height: 5px; margin: 25px 0 16px; overflow: hidden; border-radius: 99px; background: #e5edf4; }
    .progreso { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1565c0, #43a047); animation: avanzar 1.7s ease-in-out infinite; }
    .detalle { margin: 0; color: #90a4ae; font-size: .78rem; }
    @keyframes avanzar { 0% { transform: translateX(-120%); } 100% { transform: translateX(280%); } }
    @media (max-width: 520px) { body { padding: 14px; } .panel { padding: 30px 22px 26px; } }
  </style>
</head>
<body>
  <main class="panel" role="status" aria-live="polite">
    <div class="marca">PDF</div>
    <div class="spinner"></div>
    <h1>Preparando la planilla</h1>
    <p class="hoja" id="hoja">Planilla</p>
    <p class="mensaje">Estamos procesando el PDF. Esta ventana se actualizará automáticamente.</p>
    <div class="parametros">
      <span class="parametro" id="papel">Papel</span>
      <span class="parametro" id="orientacion">Orientación</span>
    </div>
    <div class="barra" aria-hidden="true"><div class="progreso"></div></div>
    <p class="detalle">No cierres esta ventana mientras se prepara el documento.</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const texto = (valor, fallback) => valor ? valor : fallback;
    document.getElementById('hoja').textContent = texto(params.get('hoja'), 'Planilla');
    document.getElementById('papel').textContent = 'Papel: ' + texto(params.get('papel'), 'LEGAL');
    document.getElementById('orientacion').textContent = 'Orientación: ' + texto(params.get('orientacion'), 'VERTICAL').toUpperCase();
    document.title = 'Preparando ' + texto(params.get('hoja'), 'planilla') + ' - PDF';
  </script>
</body>
</html>
