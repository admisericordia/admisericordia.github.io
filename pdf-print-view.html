<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista previa del PDF</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef3f8; color: #263238; font-family: Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 20px; }
    .contenedor { width: min(1200px, 100%); background: #fff; border: 1px solid #d6e0e8; border-radius: 18px; box-shadow: 0 18px 50px rgba(36, 67, 92, .14); overflow: hidden; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 16px 20px; background: linear-gradient(135deg, #0d47a1, #1565c0); color: #fff; }
    .titulo { font-size: 1.05rem; font-weight: 700; }
    .acciones { display: flex; align-items: center; gap: 12px; }
    .boton-imprimir {
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      background: #fff;
      color: #0d47a1;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .boton-imprimir:disabled { cursor: wait; opacity: .65; }
    .estado-impresion { font-size: .85rem; }
    .preview-wrap { position: relative; height: min(78vh, 820px); background: #f5f7fa; }
    .visor-pdf {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
    .pdf-loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #f5f7fa;
      color: #37474f;
      font-size: 0.95rem;
    }
    .pdf-loading[hidden] { display: none; }
    .pdf-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #c7d8e8;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: pdf-spin 0.8s linear infinite;
    }
    @keyframes pdf-spin { to { transform: rotate(360deg); } }
    .mensaje-fallback { display: none; padding: 30px 20px; text-align: center; color: #546e7a; }
    .mensaje-fallback.visible { display: block; }
    @media (max-width: 640px) {
      .toolbar { flex-direction: column; align-items: stretch; }
      .acciones { flex-direction: column; align-items: stretch; }
      .estado-impresion { text-align: center; }
    }
    @media print {
      html, body { min-height: 0; background: #fff; }
      body { display: block; padding: 0; }
      .contenedor { width: 100%; border: 0; border-radius: 0; box-shadow: none; }
      .toolbar, .mensaje-fallback { display: none !important; }
      .preview-wrap { height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="toolbar">
      <div class="titulo" id="titulo-hoja">Vista previa del PDF</div>
      <div class="acciones">
        <span class="estado-impresion" id="estado-impresion" role="status" aria-live="polite"></span>
      </div>
    </div>
    <div class="preview-wrap">
      <div class="pdf-loading" id="pdf-loading" role="status" aria-live="polite">
        <span class="pdf-spinner" aria-hidden="true"></span>
        <span>Procesando PDF…</span>
      </div>
      <iframe id="pdfFrame" class="visor-pdf" title="PDF de la planilla"></iframe>
    </div>
    <div class="mensaje-fallback" id="fallbackMessage">
      El visor no pudo mostrar el PDF directamente.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('pdfUrl');
    const driveId = params.get('driveId');
    const estaProcesando = params.get('procesando') === 'true';
    const hoja = params.get('hoja') || 'Planilla';
    const papel = params.get('papel') || 'LEGAL';
    const orientacion = (params.get('orientacion') || 'vertical').toUpperCase();

    document.getElementById('titulo-hoja').textContent = 'Vista previa: ' + hoja;
    document.title = 'Vista previa: ' + hoja;
    const frame = document.getElementById('pdfFrame');
    const loading = document.getElementById('pdf-loading');
    const fallback = document.getElementById('fallbackMessage');
    const preview = document.querySelector('.preview-wrap');
    const botonImprimir = document.getElementById('imprimir-pdf');
    const estadoImpresion = document.getElementById('estado-impresion');
    let pdfCargado = false;
    const finalizarCarga = () => {
      pdfCargado = true;
      if (botonImprimir) botonImprimir.disabled = false;
      loading.hidden = true;
      fallback.classList.remove('visible');
      preview.setAttribute('aria-busy', 'false');
      clearTimeout(timeoutCarga);
    };
    const mostrarFallback = () => {
      loading.hidden = true;
      if (botonImprimir) botonImprimir.disabled = true;
      preview.setAttribute('aria-busy', 'false');
      fallback.classList.add('visible');
      clearTimeout(timeoutCarga);
    };
    const timeoutCarga = setTimeout(() => {
      if (!pdfCargado) mostrarFallback();
    }, estaProcesando ? 90000 : 20000);
    preview.setAttribute('aria-busy', 'true');
    frame.addEventListener('load', finalizarCarga, { once: true });
    frame.addEventListener('error', mostrarFallback, { once: true });

    if (botonImprimir) {
      botonImprimir.addEventListener('click', () => {
        if (!pdfCargado) return;

        if (driveId && /^[A-Za-z0-9_-]+$/.test(driveId)) {
          const ventanaImpresion = window.open(`https://drive.google.com/file/d/${driveId}/view`, '_blank');
          estadoImpresion.textContent = ventanaImpresion
            ? 'Se abrió el PDF en Drive. Usa el botón Imprimir del visor.'
            : 'Permite las ventanas emergentes para abrir e imprimir el PDF.';
          return;
        }

        try {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          estadoImpresion.textContent = 'Se abrió el diálogo de impresión.';
        } catch (error) {
          if (!pdfUrl) {
            estadoImpresion.textContent = 'No se pudo abrir el diálogo de impresión.';
            return;
          }
          const ventanaImpresion = window.open(pdfUrl, '_blank');
          estadoImpresion.textContent = ventanaImpresion
            ? 'Se abrió el PDF en una pestaña nueva. Imprímelo desde el visor.'
            : 'Permite las ventanas emergentes para abrir e imprimir el PDF.';
        }
      });
    }

    if (driveId && /^[A-Za-z0-9_-]+$/.test(driveId)) {
      frame.setAttribute('src', `https://drive.google.com/file/d/${driveId}/preview`);
    } else if (pdfUrl) {
      frame.setAttribute('src', pdfUrl);
    } else if (!estaProcesando) {
      mostrarFallback();
    }

    if (window.matchMedia('(max-width: 640px)').matches) {
      document.getElementById('titulo-hoja').textContent = hoja;
    }
    console.info('Vista de impresión para', hoja, '| Papel:', papel, '| Orientación:', orientacion);
  </script>
</body>
</html>
